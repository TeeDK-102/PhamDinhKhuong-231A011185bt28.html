<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game kiểm tra tốc độ phản xạ</title>
<style>
:root{
  --bg:#eef3ef; --panel:#ffffff; --ink:#17302a; --muted:#5b7068; --line:#cfdcd5;
  --arena:#dcefe6; --target:#e4572e; --accent:#0f8b6d; --accent-ink:#ffffff; --danger:#c8483a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:20px 12px}
.wrap{width:100%;max-width:640px}
h1{font-size:1.5rem;margin:0 0 14px;letter-spacing:-.01em}
.stats{display:flex;gap:12px;margin-bottom:12px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat span{display:block;font-size:.8rem;color:var(--muted)}
.stat b{font-size:1.9rem;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
#arena{position:relative;width:600px;height:400px;background:var(--arena);border-radius:10px;overflow:hidden;border:2px solid var(--line);cursor:crosshair;user-select:none;max-width:none}
#arena.locked{cursor:not-allowed}
.target{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--target);border:3px solid #fff;box-shadow:0 0 0 4px rgba(228,87,46,.3);cursor:pointer;transition:transform .08s}
.target:active{transform:scale(.9)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink);text-align:center;background:rgba(255,255,255,.9);padding:16px}
.overlay[hidden]{display:none}
.overlay h2{margin:0;font-size:1.6rem}
.overlay p{margin:0;opacity:.85}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--target);outline-offset:2px}
.time-ctl{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.time-ctl small{color:var(--muted);padding:0 4px}
.time-ctl button{padding:6px 12px}
.time-ctl output{min-width:3.2ch;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.lb{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.lb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.lb-head h2{font-size:1.1rem;margin:0;margin-right:auto}
.controls input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:170px}
.controls input:focus-visible{outline:3px solid var(--target);outline-offset:2px}
.lb-head button{padding:7px 12px}
#lbList{list-style:decimal;margin:0;padding-left:1.8rem}
#lbList li{padding:6px 8px;border-radius:6px}
#lbList li::marker{font-weight:700;color:var(--muted)}
#lbList li.me{background:rgba(255,183,3,.22)}
#lbList li.empty{list-style:none;color:var(--muted);margin-left:-1.8rem}
#lbList li{display:flex;gap:10px;align-items:baseline}
#lbList li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lbList li small{color:var(--muted)}
#lbList li b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>Game kiểm tra tốc độ phản xạ</h1>
  <div class="stats">
    <div class="stat"><span>Điểm số</span><b id="score">0</b></div>
    <div class="stat"><span>Thời gian còn lại (giây)</span><b id="time">30</b></div>
  </div>
  <div class="scroll">
    <div id="arena" class="locked">
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">Sẵn sàng chưa?</h2>
        <p id="ovText">Nhập tên của bạn, chọn thời gian rồi bấm “Bắt đầu trò chơi”.</p>
      </div>
    </div>
  </div>
  <div class="controls">
    <input id="playerName" type="text" maxlength="16" placeholder="Nhập tên của bạn" aria-label="Tên người chơi" autocomplete="off">
    <button id="startBtn" disabled>Bắt đầu trò chơi</button>
    <button id="pauseBtn" class="alt" disabled>Tạm ngừng</button>
    <div class="time-ctl" aria-label="Thời gian chơi">
      <small>Thời gian chơi</small>
      <button id="minus" class="alt" aria-label="Giảm 5 giây">−5s</button>
      <output id="duration">30</output>
      <button id="plus" class="alt" aria-label="Tăng 5 giây">+5s</button>
    </div>
  </div>
  <section class="lb" aria-label="Bảng xếp hạng">
    <div class="lb-head">
      <h2>Bảng xếp hạng (top 5)</h2>
      <button id="clearLB" class="alt">Xóa bảng</button>
    </div>
    <ol id="lbList"></ol>
  </section>
</div>
 
<script>
(function(){
  const SIZE = 44, MOVE_MS = 1000, STEP = 5, MIN_D = 10, MAX_D = 120;
  const arena = document.getElementById('arena');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const durEl = document.getElementById('duration');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const plus = document.getElementById('plus');
  const minus = document.getElementById('minus');
 
  let duration = 30, timeLeft = 30, score = 0;
  let state = 'idle'; // idle | running | paused | over
  let tickTimer = null, moveTimer = null, target = null;
 
  function rand(max){ return Math.floor(Math.random() * (max + 1)); }
 
  function placeTarget(){
    if(!target){
      target = document.createElement('div');
      target.className = 'target';
      target.addEventListener('mousedown', hit);
      arena.appendChild(target);
    }
    target.style.left = rand(arena.clientWidth - SIZE) + 'px';
    target.style.top = rand(arena.clientHeight - SIZE) + 'px';
  }
 
  function restartMoveTimer(){
    clearInterval(moveTimer);
    moveTimer = setInterval(placeTarget, MOVE_MS);
  }
 
  function hit(e){
    e.stopPropagation();
    if(state !== 'running') return;
    score++;
    scoreEl.textContent = score;
    placeTarget();
    restartMoveTimer();
  }
 
  function tick(){
    timeLeft--;
    timeEl.textContent = timeLeft;
    if(timeLeft <= 0) endGame();
  }
 
  function startGame(){
    if(!nameInput.value.trim()){ nameInput.focus(); return; }
    score = 0; timeLeft = duration;
    scoreEl.textContent = 0; timeEl.textContent = timeLeft;
    overlay.hidden = true;
    arena.classList.remove('locked');
    state = 'running';
    placeTarget();
    clearInterval(tickTimer); tickTimer = setInterval(tick, 1000);
    restartMoveTimer();
    startBtn.textContent = 'Chơi lại';
    pauseBtn.disabled = false; pauseBtn.textContent = 'Tạm ngừng';
    setDurationButtons();
  }
 
  function pauseGame(){
    state = 'paused';
    clearInterval(tickTimer); clearInterval(moveTimer);
    if(target) target.style.display = 'none';
    arena.classList.add('locked');
    ovTitle.textContent = 'Đã tạm ngừng';
    ovText.textContent = 'Bấm “Tiếp tục” để chơi tiếp.';
    overlay.hidden = false;
    pauseBtn.textContent = 'Tiếp tục';
    setDurationButtons();
  }
 
  function resumeGame(){
    state = 'running';
    overlay.hidden = true;
    arena.classList.remove('locked');
    if(target) target.style.display = '';
    placeTarget();
    tickTimer = setInterval(tick, 1000);
    restartMoveTimer();
    pauseBtn.textContent = 'Tạm ngừng';
    setDurationButtons();
  }
 
  function endGame(){
    state = 'over';
    clearInterval(tickTimer); clearInterval(moveTimer);
    if(target){ target.remove(); target = null; }
    arena.classList.add('locked');
    ovTitle.textContent = 'Hết giờ!';
    const pos = addScore();
    renderLB(pos);
    ovTitle.textContent = pos >= 0 ? 'Hạng #' + (pos + 1) + ' - ' + rankTitle() : 'Hết giờ! ' + rankTitle();
    ovText.textContent = nameInput.value.trim() + ' đạt ' + score + ' điểm' + (pos >= 0 ? '. Bạn đứng thứ ' + (pos + 1) + ' trên bảng xếp hạng.' : '. Chưa lọt vào top 5.');
    overlay.hidden = false;
    pauseBtn.disabled = true; pauseBtn.textContent = 'Tạm ngừng';
    setDurationButtons();
  }
 
  // Tăng/giảm thời gian chơi: khi đang chơi hoặc tạm ngừng thì cộng/trừ trực tiếp vào thời gian còn lại
  function changeTime(delta){
    const d = Math.min(MAX_D, Math.max(MIN_D, duration + delta));
    if(d === duration) return;
    const diff = d - duration;
    duration = d;
    durEl.textContent = duration;
    if(state === 'idle' || state === 'over'){
      timeLeft = duration; timeEl.textContent = timeLeft;
    } else {
      timeLeft = Math.max(1, timeLeft + diff);
      timeEl.textContent = timeLeft;
    }
    setDurationButtons();
  }
 
  function setDurationButtons(){
    plus.disabled = duration >= MAX_D;
    minus.disabled = duration <= MIN_D;
  }
 
  // Click vào nền arena (trượt) không tính điểm
  arena.addEventListener('mousedown', function(){});
 
  // ===== Bảng xếp hạng =====
  const LB_KEY = 'reaction-leaderboard';
  const nameInput = document.getElementById('playerName');
  const lbList = document.getElementById('lbList');
  function loadLB(){
    try{ const r = localStorage.getItem(LB_KEY); return r ? JSON.parse(r) : []; }
    catch(e){ return []; }
  }
  function saveLB(){
    try{ localStorage.setItem(LB_KEY, JSON.stringify(board)); }catch(e){}
  }
  let board = loadLB();
 
  function renderLB(highlight){
    lbList.innerHTML = '';
    if(!board.length){
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'Chưa có ai. Hãy chơi ván đầu tiên!';
      lbList.appendChild(li);
      return;
    }
    board.forEach(function(e, i){
      const li = document.createElement('li');
      if(i === highlight) li.className = 'me';
      const n = document.createElement('span'); n.textContent = e.name;
      const d = document.createElement('small'); d.textContent = e.duration + ' giây';
      const s = document.createElement('b'); s.textContent = e.score + ' điểm';
      li.append(n, d, s);
      lbList.appendChild(li);
    });
  }
 
  function addScore(){
    const name = (nameInput.value.trim() || 'Người chơi').slice(0, 16);
    const entry = { name: name, score: score, duration: duration };
    board.push(entry);
    board.sort(function(a, b){ return b.score - a.score; });
    const idx = board.indexOf(entry);
    board = board.slice(0, 5);
    saveLB();
    return idx < 5 ? idx : -1;
  }
 
  function rankTitle(){
    const rate = score / duration;
    if(rate >= 0.8) return 'Tia chớp!';
    if(rate >= 0.5) return 'Thợ săn giỏi!';
    if(rate >= 0.3) return 'Khá lắm!';
    return 'Cần luyện thêm!';
  }
 
  document.getElementById('clearLB').addEventListener('click', function(){
    board = []; saveLB(); renderLB(-1);
  });
  renderLB(-1);
 
  function syncStart(){ startBtn.disabled = !nameInput.value.trim(); }
  nameInput.addEventListener('input', syncStart);
  nameInput.addEventListener('keydown', function(e){ if(e.key === 'Enter' && state !== 'running' && state !== 'paused') startGame(); });
  syncStart();
 
  startBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', function(){
    if(state === 'running') pauseGame();
    else if(state === 'paused') resumeGame();
  });
  plus.addEventListener('click', function(){ changeTime(STEP); });
  minus.addEventListener('click', function(){ changeTime(-STEP); });
  setDurationButtons();
})();
</script>
</body>
</html>
